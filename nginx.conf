server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Redirections relatives : fonctionne derrière le proxy HTTPS de Dokploy (Traefik).
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json
               application/xml image/svg+xml text/plain;

    # URL canoniques sans slash final : /about/ → /about
    rewrite ^/(.+)/$ /$1 permanent;

    # Accueil. try_files $uri ne teste que des fichiers : « / » (un dossier)
    # tomberait sur =404 sans cette règle dédiée.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Pages pré-rendues : /about → about.html. Inconnu → 404.html (statut 404).
    location / {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # Fichiers produits par Vite : nom haché, donc cache permanent.
    # ^~ : prioritaire sur la règle des images ci-dessous.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images de public/ (noms non hachés) : cache d'une journée.
    location ~* \.(?:png|jpe?g|webp|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    error_page 404 /404.html;
}
